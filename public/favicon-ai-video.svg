<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Hexagonal Backing -->
  <rect width="64" height="64" rx="16" fill="#070B14" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Outer Neon Aperture Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#neonCyan)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- AI Lens Camera Shutter Hexagon -->
  <polygon points="32,15 47,23.5 47,40.5 32,49 17,40.5 17,23.5" stroke="url(#neonMagenta)" stroke-width="2" fill="none" opacity="0.9"/>
  
  <!-- Glowing Play / Cinema Symbol in Center -->
  <polygon points="27,24 43,32 27,40" fill="url(#neonCyan)" filter="url(#neonGlow)"/>
  
  <!-- Sparkle AI Star Node at top right -->
  <circle cx="48" cy="16" r="3" fill="#00F5D4" filter="url(#neonGlow)"/>
  <circle cx="16" cy="48" r="2" fill="#F72585" filter="url(#neonGlow)"/>
</svg>
