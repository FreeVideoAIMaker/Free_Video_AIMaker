services:
  - type: web
    name: freevideoaimaker
    runtime: node
    plan: free
    region: frankfurt # or oregon, ohio, singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # HF_TOKEN is configured securely in the Render Dashboard Environment tab.
      # Setting sync: false ensures your private token is NEVER written to Git or scanned!
      - key: HF_TOKEN
        sync: false
